name: release

on:
  workflow_dispatch:
    inputs:
      force_build:
        type: boolean
        default: false
  push:
    tags:
      - "osm_renderer-v*"

permissions:
  contents: write

jobs:
  build-lgx:
    name: Build ${{ matrix.module }} .lgx (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [linux-amd64, windows-x86_64]
        module: [renderer, app]
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build ${{ matrix.module }} .lgx (portable)
        working-directory: ${{ matrix.module }}
        env:
          # linux-amd64 builds the local system; windows-x86_64 cross-builds
          # the x86_64-windows variant (a mingw build realised on the Linux
          # runner, the same way the osm catalog release does it).
          LGX_ATTR: ${{ matrix.target == 'windows-x86_64' && 'packages.x86_64-windows.lgx-portable' || 'lgx-portable' }}
        run: |
          set -euo pipefail
          # --print-out-paths prints the store path; --no-link avoids creating
          # a `result` symlink (so we must NOT readlink `result`).
          out=$(nix build ".#${LGX_ATTR}" --print-out-paths --no-link)
          lgx=$(find "$out" -maxdepth 2 -name '*.lgx' | head -n1)
          if [[ -z "$lgx" ]]; then echo "::error::nix build produced no .lgx (out=$out)"; exit 1; fi
          mkdir -p "$GITHUB_WORKSPACE/_artifacts"
          name="osm_renderer"
          [[ "${{ matrix.module }}" == "renderer" ]] && name="osm_renderer_core"
          cp "$lgx" "$GITHUB_WORKSPACE/_artifacts/${name}-${{ matrix.target }}.lgx"
          echo "built $name ${{ matrix.target }}: $lgx"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-${{ matrix.target }}
          path: _artifacts/*.lgx
          if-no-files-found: error

  release:
    name: Publish release
    needs: build-lgx
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/osm_renderer-v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: _artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: _artifacts/*.lgx
          generate_release_notes: true
