name: release

on:
  workflow_dispatch:
    inputs:
      force_build:
        type: boolean
        default: false
  push:
    tags:
      - "osm_renderer-v*"

permissions:
  contents: write

jobs:
  build-lgx:
    name: Build osm_renderer .lgx (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            nix_system: x86_64-linux
          - target: windows-x86_64
            nix_system: x86_64-windows
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build .lgx (portable)
        working-directory: app
        run: |
          nix build ".#lgx-portable" \
            --override-input logos-osm github:aegonmyy/logos-osm \
            --print-out-paths --no-link
          out=$(cat result)
          lgx=$(find "$out" -maxdepth 2 -name '*.lgx' | head -n1)
          if [[ -z "$lgx" ]]; then echo "::error::nix build produced no .lgx"; exit 1; fi
          mkdir -p "$GITHUB_WORKSPACE/_artifacts"
          cp "$lgx" "$GITHUB_WORKSPACE/_artifacts/osm_renderer-${{ matrix.target }}.lgx"

      - uses: actions/upload-artifact@v4
        with:
          name: osm_renderer-${{ matrix.target }}
          path: _artifacts/osm_renderer-${{ matrix.target }}.lgx
          if-no-files-found: error

  release:
    name: Publish release
    needs: build-lgx
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/osm_renderer-v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: _artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: _artifacts/*.lgx
          generate_release_notes: true
