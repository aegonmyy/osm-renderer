name: release

on:
  workflow_dispatch:
    inputs:
      force_build:
        type: boolean
        default: false
  push:
    tags:
      - "osm_renderer-v*"

permissions:
  contents: write

jobs:
  build-lgx:
    name: Build ${{ matrix.module }} .lgx (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [linux-amd64, windows-x86_64]
        module: [renderer, app]
        exclude:
          # The renderer core is a Rust cdylib; the windows variant is produced
          # by the builder's mingw cross-build (x86_64-windows). Both legs
          # build it; this matrix just names them.
          - module: renderer
            target: irrelevant
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build ${{ matrix.module }} .lgx (portable)
        working-directory: ${{ matrix.module }}
        run: |
          nix build ".#lgx-portable" --print-out-paths --no-link
          out="$(readlink -f result)"
          lgx=$(find "$out" -maxdepth 2 -name '*.lgx' | head -n1)
          if [[ -z "$lgx" ]]; then echo "::error::nix build produced no .lgx"; exit 1; fi
          mkdir -p "$GITHUB_WORKSPACE/_artifacts"
          name="osm_renderer"
          [[ "${{ matrix.module }}" == "renderer" ]] && name="osm_renderer_core"
          cp "$lgx" "$GITHUB_WORKSPACE/_artifacts/${name}-${{ matrix.target }}.lgx"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-${{ matrix.target }}
          path: _artifacts/*.lgx
          if-no-files-found: error

  release:
    name: Publish release
    needs: build-lgx
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/osm_renderer-v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: _artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: _artifacts/*.lgx
          generate_release_notes: true
