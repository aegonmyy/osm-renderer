[package]
name = "osm-renderer"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Standalone raster map renderer for the osm_renderer Basecamp app: parses a region .osm.pbf and renders slippy-map PNG tiles."

[lib]
name = "osm_renderer"
crate-type = ["lib", "cdylib"]

[dependencies]
osmpbf = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
serde_json = "1"

[[example]]
name = "render"
path = "examples/render.rs"
