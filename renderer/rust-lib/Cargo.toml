[package]
name = "osm_renderer"
version = "0.1.0"
edition = "2021"

# Standalone crate — the empty table keeps cargo from adopting any workspace it
# finds in a parent directory.
[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
osmpbf = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Path dependency staged by the module-builder's `rust-sdk-src` output before
# `cargo generate-lockfile` runs, so the crate locks against the SAME SDK the
# builder links and runs the generator from.
logos-rust-sdk = { path = "../logos-rust-sdk-src" }
